<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nekenzie Cup 2026</title>
    <meta name="description" content="Official Nekenzie Cup 2026 tournament web app for fixtures, live scores, standings leaderboard, and point hunter." />
    
    <!-- Inline Theme Initializer to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('nekenzie_theme');
          const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- App Meta -->
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.svg" />

    <!-- Fonts: Cormorant Garamond 300/400 (Display Serif), Inter & Plus Jakarta Sans (Grotesk), JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:title" content="Nekenzie Cup 2026" />
    <meta property="og:description" content="Official Nekenzie Cup tournament app for players and spectators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body class="h-full bg-[#ffffff] dark:bg-[#0a0d14] text-[#000000] dark:text-[#f8fafc] antialiased select-none overscroll-none transition-colors duration-200">
    <div id="root" class="h-full w-full overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
